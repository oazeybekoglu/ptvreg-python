[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptvreg-torch"
version = "0.2.0"
description = "PyTorch port of pTVreg — parametric total-variation image registration"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Onur Ali Zeybekoglu", email = "onur-ali.zeybekoglu@it.uu.se" },
]
keywords = [
    "image-registration", "deformable-registration",
    "total-variation", "pytorch", "medical-imaging",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch>=1.12",
    "numpy>=1.21",
]

[project.optional-dependencies]
examples = ["nibabel>=4.0", "scipy>=1.7", "matplotlib>=3.4"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/oazeybekoglu/ptvreg-python"
Issues   = "https://github.com/oazeybekoglu/ptvreg-python/issues"

[tool.setuptools.packages.find]
where = ["src"]
